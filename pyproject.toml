[project]
name = "al"
version = "0.1.0"
description = "A streamlined CLI tool for managing aliases on Linux systems, simplifying the creation, deletion, and management of command shortcuts."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Vaadeendra", email = "42719383+Vaadee@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = ["pydantic (>=2.11.3,<3.0.0)", "typer (>=0.15.2,<0.16.0)"]

[project.scripts]
al = "al:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.5",
]

[tool.ruff.lint]
# On top of the defaults (`E4`, E7`, `E9`, and `F`), enable flake8-bugbear (`B`) and flake8-quotes (`Q`).
select = ["ALL"]
ignore = ["S603"]

