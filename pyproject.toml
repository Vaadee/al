[project]
name = "al-alias-manager"
version = "0.1.0"
description = "A streamlined CLI tool for managing aliases on Linux systems, simplifying the creation, deletion, and management of command shortcuts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vaadeendra", email = "42719383+Vaadee@users.noreply.github.com" }
]
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "requests>=2.31.0",
]

[project.scripts]
al = "al.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=7.0.0",
    "ruff>=0.11.5",
    "ty>=0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["al"]

[tool.ruff.lint]
# On top of the defaults (`E4`, E7`, `E9`, and `F`), enable flake8-bugbear (`B`) and flake8-quotes (`Q`).
select = ["ALL"]
ignore = [
    "S603", "B008", "S602",  # Shell/Typer specific
    "C901", "PLR0912",       # Complexity
    "FBT001",                # Boolean args (Typer flags)
    "A001",                  # Shadowing (help command)
    "SLF001",                # Private access
    "BLE001",                # Blind exception (network)
    "ERA001",                # Commented code
    "PLR2004",               # Magic values
    "TRY300",                # Try/Else
    "D203", "D212",          # Docstring
    "COM812",                # Comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
